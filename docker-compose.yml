version: "3.8"

services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      HOST: db
      ROOT_PASSWORD: ${ROOT_PASSWORD}

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: .
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=${DATABASE}
      - DB_USER=${USER}
      - DB_PASSWORD=${PASSWORD}
      - APP_TIMEZONE=${APP_TIMEZONE:-UTC}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE}
      MYSQL_USER: ${USER}
      MYSQL_PASSWORD: ${PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d

  backup:
    image: fradelg/mysql-cron-backup
    depends_on:
      - db
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=${USER}
      - MYSQL_PASS=${PASSWORD}
      - MYSQL_DB=${DATABASE}
      - CRON_TIME=0 20 * * *
      - MAX_BACKUPS=14
      - INIT_BACKUP=1
    volumes:
      - ./backups:/backup
    restart: always

volumes:
  db_data:
